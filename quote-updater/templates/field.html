{% if !field.choices.is_empty() %}
<div class=field>
  <span class=key>{{ field.label }}</span>
  {# The key itself, so the post says the field was on the page even with no box ticked. #}
  <input type=hidden name="{{ field.name }}" value="">
  <div class=choices>
    {% for choice in field.choices %}
    <label class=check>
      <input type=checkbox name="{{ choice.name }}"{% if choice.checked %} checked{% endif %}>
      <span class=choice-name>{{ choice.label }}</span>
    </label>
    {% endfor %}
  </div>
  <span class=fieldhint>{{ field.hint }}</span>
</div>
{% else %}
<label>
  <span class=key>{{ field.label }}</span>
  {% if field.multiline %}
  <textarea name="{{ field.name }}" placeholder="{{ field.placeholder }}" rows=6 spellcheck=false>{{ field.value }}</textarea>
  {% else %}
  <input type="{% if field.secret %}password{% else %}text{% endif %}"
         name="{{ field.name }}"
         value="{{ field.value }}"
         placeholder="{{ field.placeholder }}"
         spellcheck=false
                  autocomplete="{% if field.secret %}new-password{% else %}off{% endif %}"
         {% if field.readonly %}readonly{% endif %}>
  {% endif %}
  <span class=fieldhint>{{ field.hint }}</span>
</label>
{% endif %}
